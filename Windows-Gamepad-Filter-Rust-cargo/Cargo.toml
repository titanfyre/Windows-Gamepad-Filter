[package]
name = "windows-gamepad-filter"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Windows x64 Windows-Gamepad-Filter SDK with product-specific native bindings"
license = "MIT"
repository = "https://github.com/titanfyre/Windows-Gamepad-Filter"
readme = "README.md"
build = "build.rs"
include = ["src/**", "build.rs", "native/**", "README.md", "LICENSE", "docs/**", "examples/**"]

[lib]
name = "windows_gamepad_filter"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
